name: build-and-release

# Builds distributable bundles on a tag push (`v*`) or manual dispatch.
# Bootstrap ships UNSIGNED on both platforms; the signing secrets below are
# scaffolded but unset, so tauri-action produces unsigned artifacts. Populate
# the secrets later to enable signing without editing this workflow. See
# docs/release-and-signing.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Gate the release on a matching CHANGELOG.md section and hand its text to the
  # build job. Tag-guarded: on workflow_dispatch (a branch ref, not vX.Y.Z) this
  # job is skipped, and publish runs with no injected changelog body.
  changelog:
    name: Changelog gate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      # Base64-encoded to preserve newlines across the job boundary — GitHub
      # Actions job outputs mishandle raw multi-line strings.
      body_b64: ${{ steps.extract.outputs.body_b64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section for $VERSION"
            exit 1
          fi
          ENCODED=$(printf '%s' "$BODY" | base64 | tr -d '\n')
          echo "body_b64=$ENCODED" >> "$GITHUB_OUTPUT"

  publish:
    name: Build (${{ matrix.platform }})
    needs: changelog
    # tauri-action creates the GitHub release, which needs write access to
    # repository contents. Without this, GITHUB_TOKEN defaults to read-only and
    # release creation fails with "Resource not accessible by integration".
    permissions:
      contents: write
    # Run even when the changelog gate is skipped (workflow_dispatch), but not
    # when it failed (missing section) or the run was cancelled.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Decode the changelog body from the gate job. Skipped on workflow_dispatch
      # (gate skipped → no output), leaving releaseBody empty. bash shell so
      # `base64` is available on the Windows runner too.
      - name: Decode changelog body
        id: changelog
        if: needs.changelog.result == 'success'
        shell: bash
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s' "${{ needs.changelog.outputs.body_b64 }}" | base64 -d
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Signing env vars. All optional for bootstrap; tauri-action ignores
      # them when absent and produces unsigned bundles.
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevKit ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
